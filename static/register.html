<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placement Cell - Register</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
  <div class="auth-card" style="max-width:520px;">
    <div class="brand">
      <h1>Student Registration</h1>
      <p>Create your placement cell profile</p>
    </div>
    <form id="regForm">
      <div class="form-grid">
        <input type="text" id="name" placeholder="Full name" required>
        <input type="email" id="email" placeholder="Email address" required>
        <input type="text" id="rollno" placeholder="Roll number" required>
        <input type="password" id="password" placeholder="Password" minlength="6" required>
      </div>
      <div class="form-grid">
        <select id="branch" required>
          <option value="">-- Branch --</option>
          <option>CSE</option><option>ECE</option><option>ME</option><option>CE</option><option>IT</option>
        </select>
        <select id="academic_year" required>
          <option value="">-- Year --</option>
          <option value="1">1</option><option value="2">2</option>
          <option value="3">3</option><option value="4">4</option>
        </select>
        <input type="number" id="cgpa" placeholder="CGPA (0-10)" min="0" max="10" step="0.01" required>
        <input type="number" id="backlogs" placeholder="Backlogs" min="0" step="1" value="0" required>
      </div>
      <input type="text" id="skills" placeholder="Skills (comma separated)">
      <input type="text" id="phone" placeholder="Phone (optional)">
      <button type="submit" class="btn primary">Create Account</button>
      <p id="msg" class="msg"></p>
    </form>
    <p class="auth-alt">Already registered? <a href="/login.html">Login</a></p>
  </div>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/register.js"></script>
</body>
</html>
